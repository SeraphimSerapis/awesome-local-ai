# SPDX-License-Identifier: MIT
name: Repository health

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 1"

permissions:
  contents: read

concurrency:
  group: catalog-health
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Observe public repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health.py
      - name: Generate and validate the browsing view
        run: |
          python scripts/catalog.py render
          python scripts/catalog.py check
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Open or update a reviewable health PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/catalog-health
          add-paths: |
            data/health.json
            README.md
          commit-message: "chore: refresh repository health observations"
          title: "Refresh weekly repository health observations"
          body: |
            Refresh public GitHub repository observations and the generated README.

            Review unavailable, archived, disabled, or redirected repositories.
            Failed checks retain prior observations; they do not establish that a project is gone.
            Documentation-review dates and curated project records are unchanged.
            No upstream code was installed or run, and no entries were removed.
            Routine refreshes merge after the health safety gate and all catalog CI jobs pass.
            Flagged observations or other changes stay open for manual review.
      - name: Run catalog CI and merge a routine refresh
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/dispatches" \
            -f ref=automation/catalog-health -F return_run_details=true --jq '.workflow_run_id')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Missing CI run ID; leaving PR for review."; exit 1; }
          gh run watch "$run_id" --exit-status --interval 10
          HEALTH_CI_RUN_ID="$run_id" python scripts/merge_health.py
